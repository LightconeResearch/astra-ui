name: Continuous release

# Publishes review builds for commits and pull requests. Consumer dependencies
# use npm releases; this workflow remains available for testing future changes.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm pack` runs the package's prepack build, so no separate build step.
      - run: npm exec -- pkg-pr-new publish ./packages/react --comment=update
