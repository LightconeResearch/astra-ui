name: Continuous release

# Publishes @astra-spec/ui for every commit and pull request to pkg.pr.new, so a
# consumer can try an unreleased build with one line, for example
#
#   npm install https://pkg.pr.new/@astra-spec/ui@<pr-number>
#
# pkg.pr.new posts (and keeps updating) that install line as a PR comment. The
# pkg.pr.new GitHub App must be installed on this repository for publishing to
# work: https://github.com/apps/pkg-pr-new. Nothing is published to npm.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm pack` runs the package's prepack build, so no separate build step.
      - run: npm exec -- pkg-pr-new publish ./packages/react --comment=update
